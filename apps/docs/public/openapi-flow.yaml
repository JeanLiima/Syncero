openapi: '3.0.3'

info:
  title: Syncero Flow API
  version: '1.0.0'
  description: |
    API privada do **Syncero Flow** — app de gestão financeira para empresas.

    ### Autenticação
    Todas as rotas protegidas exigem um **Bearer JWT** emitido pelo Supabase, passado no header `Authorization`.

    ### Autorização
    - A maioria das rotas requer que o usuário seja **membro ativo** da empresa (`company_members.status = 'accepted'`).
    - Rotas de administração exigem `role = 'admin'`.

servers:
  - url: http://localhost:5174
    description: Desenvolvimento local
  - url: https://syncero-flow.vercel.app
    description: Produção

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Perfil do usuário autenticado
  - name: companies
    description: Empresas e membros
  - name: transactions
    description: Lançamentos financeiros
  - name: categories
    description: Categorias de lançamentos
  - name: banks
    description: Contas bancárias
  - name: contacts
    description: Contatos (clientes e fornecedores)
  - name: payables
    description: Contas a pagar e a receber
  - name: reports
    description: Relatórios agregados (fluxo de caixa, DRE)
  - name: invites
    description: Convites de membros e contadores

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Error:
      type: object
      properties:
        error: { type: string }

    TransactionType:
      type: string
      enum: [income, expense]

    TransactionNature:
      type: string
      enum:
        - sale_service
        - loan_received
        - capital_contribution
        - operational_expense
        - product_cost
        - asset_purchase
        - debt_payment
        - owner_withdrawal

    PaymentMethod:
      type: string
      enum: [cash, bank]

    Transaction:
      type: object
      properties:
        id:                    { type: string, format: uuid }
        company_id:            { type: string, format: uuid }
        category_id:           { type: string, format: uuid, nullable: true }
        contact_id:            { type: string, format: uuid, nullable: true }
        description:           { type: string }
        amount:                { type: number, minimum: 0.01 }
        type:                  { $ref: '#/components/schemas/TransactionType' }
        date:                  { type: string, format: date }
        is_paid:               { type: boolean }
        notes:                 { type: string, nullable: true }
        counterpart:           { type: string, nullable: true }
        paid_at:               { type: string, format: date, nullable: true }
        payment_method:        { $ref: '#/components/schemas/PaymentMethod' }
        bank_id:               { type: string, format: uuid, nullable: true }
        nature:                { $ref: '#/components/schemas/TransactionNature' }
        is_installment:        { type: boolean }
        installment_count:     { type: integer, nullable: true }
        installment_number:    { type: integer, nullable: true }
        installment_group_id:  { type: string, format: uuid, nullable: true }
        payment_registered_at: { type: string, format: date-time, nullable: true }
        payment_registered_by: { type: string, format: uuid, nullable: true }
        created_by:            { type: string, format: uuid }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }
        categories:
          nullable: true
          type: object
          properties:
            id:    { type: string, format: uuid }
            name:  { type: string }
            color: { type: string, nullable: true }
        banks:
          nullable: true
          type: object
          properties:
            id:   { type: string, format: uuid }
            name: { type: string }
        contacts:
          nullable: true
          type: object
          properties:
            id:   { type: string, format: uuid }
            name: { type: string }
            cpf:  { type: string, nullable: true }
            cnpj: { type: string, nullable: true }

    TransactionInput:
      type: object
      required: [companyId, description, amount, type, date]
      properties:
        companyId:          { type: string, format: uuid }
        description:        { type: string }
        amount:             { type: number, minimum: 0.01 }
        type:               { $ref: '#/components/schemas/TransactionType' }
        date:               { type: string, format: date }
        is_paid:            { type: boolean, default: false }
        paid_at:            { type: string, format: date, nullable: true }
        payment_method:     { $ref: '#/components/schemas/PaymentMethod' }
        bank_id:            { type: string, format: uuid, nullable: true }
        category_id:        { type: string, format: uuid, nullable: true }
        contact_id:         { type: string, format: uuid, nullable: true }
        nature:             { $ref: '#/components/schemas/TransactionNature' }
        notes:              { type: string, nullable: true }
        counterpart:        { type: string, nullable: true }
        is_installment:     { type: boolean, default: false }
        installment_count:  { type: integer, nullable: true }

    Category:
      type: object
      properties:
        id:         { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name:       { type: string }
        type:       { $ref: '#/components/schemas/TransactionType' }
        color:      { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Bank:
      type: object
      properties:
        id:           { type: string, format: uuid }
        company_id:   { type: string, format: uuid }
        name:         { type: string }
        account_type: { type: string }
        created_at:   { type: string, format: date-time }

    Contact:
      type: object
      properties:
        id:         { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name:       { type: string }
        cpf:        { type: string, nullable: true }
        cnpj:       { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Payable:
      type: object
      properties:
        id:           { type: string, format: uuid }
        company_id:   { type: string, format: uuid }
        description:  { type: string }
        amount:       { type: number }
        type:         { type: string, enum: [payable, receivable] }
        due_date:     { type: string, format: date }
        paid_date:    { type: string, format: date, nullable: true }
        status:       { type: string, enum: [pending, paid, overdue, cancelled] }
        contact_name: { type: string, nullable: true }
        notes:        { type: string, nullable: true }
        created_at:   { type: string, format: date-time }

    Company:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        cnpj:       { type: string, nullable: true }
        tax_regime: { type: string, enum: [simples, lucro_presumido, lucro_real], nullable: true }
        owner_id:   { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MemberRole:
      type: string
      enum: [admin, member, viewer]

    MemberStatus:
      type: string
      enum: [active, invited, inactive]

    CompanyMember:
      type: object
      properties:
        id:          { type: string, format: uuid }
        company_id:  { type: string, format: uuid }
        user_id:     { type: string, format: uuid, nullable: true }
        email:       { type: string, format: email }
        role:        { $ref: '#/components/schemas/MemberRole' }
        status:      { $ref: '#/components/schemas/MemberStatus' }
        invited_at:  { type: string, format: date-time }
        joined_at:   { type: string, format: date-time, nullable: true }

    PaginatedTransactions:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        count: { type: integer }

    CashFlowDay:
      type: object
      properties:
        date:    { type: string, format: date }
        income:  { type: number }
        expense: { type: number }
        balance: { type: number }

    IncomeStatementLine:
      type: object
      properties:
        category_id:   { type: string, format: uuid, nullable: true }
        category_name: { type: string }
        total:         { type: number }

paths:

  # ── Auth ──────────────────────────────────────────────────────

  /api/me:
    get:
      tags: [auth]
      summary: Obter perfil do usuário autenticado
      responses:
        '200':
          description: Perfil do usuário com empresa ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:            { type: string, format: uuid }
                  full_name:     { type: string }
                  email:         { type: string }
                  user_type:     { type: string, enum: [company_user, accountant] }
                  avatar_url:    { type: string, nullable: true }
        '401':
          description: Não autenticado

    post:
      tags: [auth]
      summary: Criar ou atualizar perfil (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, user_type]
              properties:
                full_name: { type: string }
                user_type: { type: string, enum: [company_user, accountant] }
      responses:
        '200':
          description: Perfil criado ou atualizado

  # ── Companies ─────────────────────────────────────────────────

  /api/companies:
    post:
      tags: [companies]
      summary: Criar empresa
      description: Cria empresa e adiciona o usuário como admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                cnpj:       { type: string, nullable: true, example: '00000000000000' }
                tax_regime: { type: string, enum: [simples, lucro_presumido, lucro_real], nullable: true }
      responses:
        '201':
          description: Empresa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }

  /api/companies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [companies]
      summary: Obter detalhes da empresa
      responses:
        '200':
          description: Dados da empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { description: Sem acesso }
    patch:
      tags: [companies]
      summary: Atualizar empresa (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:       { type: string }
                cnpj:       { type: string, nullable: true }
                tax_regime: { type: string, enum: [simples, lucro_presumido, lucro_real], nullable: true }
      responses:
        '200':
          description: Empresa atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }

  # ── Company Members ───────────────────────────────────────────

  /api/company-members:
    get:
      tags: [companies]
      summary: Listar membros da empresa
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista de membros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyMember' }
    post:
      tags: [companies]
      summary: Convidar membro (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, email, role]
              properties:
                companyId: { type: string, format: uuid }
                email:     { type: string, format: email }
                role:      { $ref: '#/components/schemas/MemberRole' }
      responses:
        '201': { description: Convite enviado }
        '409': { description: Membro já existe }

  /api/company-members/{id}/role:
    patch:
      tags: [companies]
      summary: Alterar papel do membro (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/MemberRole' }
      responses:
        '200': { description: Papel atualizado }

  /api/company-members/{id}/resend:
    post:
      tags: [companies]
      summary: Reenviar convite de membro (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: E-mail reenviado }

  /api/company-members/{id}:
    delete:
      tags: [companies]
      summary: Remover membro (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Membro removido }

  # ── Accountant Companies ──────────────────────────────────────

  /api/accountant-companies:
    get:
      tags: [companies]
      summary: Listar vínculos com contadores
      parameters:
        - name: companyId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista de vínculos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:           { type: string, format: uuid }
                    company_id:   { type: string, format: uuid }
                    accountant_id:{ type: string, format: uuid, nullable: true }
                    email:        { type: string }
                    status:       { type: string, enum: [pending, accepted, rejected] }
                    invited_at:   { type: string, format: date-time }
                    accepted_at:  { type: string, format: date-time, nullable: true }
    post:
      tags: [companies]
      summary: Convidar contador (admin)
      description: Uma empresa pode ter no máximo um contador. Retorna 409 se já existe vínculo ativo ou pendente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, email, invite_token]
              properties:
                companyId:    { type: string, format: uuid }
                email:        { type: string, format: email }
                invite_token: { type: string, format: uuid }
      responses:
        '201': { description: Convite criado e e-mail enviado }
        '409': { description: Vínculo já existe }

  /api/accountant-companies/{id}/resend:
    post:
      tags: [companies]
      summary: Reenviar convite de contador (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: E-mail reenviado }

  /api/accountant-companies/{id}:
    delete:
      tags: [companies]
      summary: Revogar acesso do contador (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Acesso revogado }

  # ── Invites ───────────────────────────────────────────────────

  /api/invites/{token}:
    get:
      tags: [invites]
      summary: Verificar token de convite (público)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dados do convite
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:        { type: string, enum: [member, accountant] }
                  companyName: { type: string }
                  status:      { type: string }
        '404': { description: Token inválido }

  /api/invites/{token}/accept:
    post:
      tags: [invites]
      summary: Aceitar convite de membro
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Convite aceito }
        '409': { description: Convite já usado ou expirado }

  # ── Transactions ──────────────────────────────────────────────

  /api/transactions:
    get:
      tags: [transactions]
      summary: Listar lançamentos com paginação
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TransactionType' }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: is_paid
          in: query
          schema: { type: boolean }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: search
          in: query
          schema: { type: string }
          description: Busca por descrição (case-insensitive)
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 1000 }
      responses:
        '200':
          description: Página de lançamentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedTransactions' }

    post:
      tags: [transactions]
      summary: Criar lançamento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201':
          description: Lançamento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }

  /api/transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [transactions]
      summary: Obter lançamento com detalhes
      responses:
        '200':
          description: Lançamento com relações expandidas
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Transaction' }
                  - type: object
                    properties:
                      creator_name:           { type: string, nullable: true }
                      payment_registrar_name: { type: string, nullable: true }
        '404': { description: Não encontrado }

    patch:
      tags: [transactions]
      summary: Atualizar lançamento
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:    { type: string }
                amount:         { type: number }
                type:           { $ref: '#/components/schemas/TransactionType' }
                date:           { type: string, format: date }
                is_paid:        { type: boolean }
                paid_at:        { type: string, format: date, nullable: true }
                payment_method: { $ref: '#/components/schemas/PaymentMethod' }
                bank_id:        { type: string, format: uuid, nullable: true }
                category_id:    { type: string, format: uuid, nullable: true }
                contact_id:     { type: string, format: uuid, nullable: true }
                nature:         { $ref: '#/components/schemas/TransactionNature' }
                notes:          { type: string, nullable: true }
      responses:
        '200':
          description: Lançamento atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }

    delete:
      tags: [transactions]
      summary: Excluir lançamento
      responses:
        '200':
          description: Excluído com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ── Categories ────────────────────────────────────────────────

  /api/categories:
    get:
      tags: [categories]
      summary: Listar categorias
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

    post:
      tags: [categories]
      summary: Criar categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, name, type]
              properties:
                companyId: { type: string, format: uuid }
                name:      { type: string }
                type:      { $ref: '#/components/schemas/TransactionType' }
                color:     { type: string, nullable: true }
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }

  /api/categories/{id}/usage:
    get:
      tags: [categories]
      summary: Contar lançamentos vinculados
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  usageCount: { type: integer }

  /api/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [categories]
      summary: Atualizar categoria
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:  { type: string }
                color: { type: string, nullable: true }
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [categories]
      summary: Excluir categoria (com transferência opcional)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transferToId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Se informado, move os lançamentos para esta categoria antes de excluir
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ── Banks ─────────────────────────────────────────────────────

  /api/banks:
    get:
      tags: [banks]
      summary: Listar contas bancárias
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bank' }
    post:
      tags: [banks]
      summary: Criar conta bancária
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, name, account_type]
              properties:
                companyId:    { type: string, format: uuid }
                name:         { type: string }
                account_type: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bank' }

  /api/banks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [banks]
      summary: Atualizar conta bancária
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:         { type: string }
                account_type: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bank' }
    delete:
      tags: [banks]
      summary: Excluir conta bancária
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ── Contacts ──────────────────────────────────────────────────

  /api/contacts:
    get:
      tags: [contacts]
      summary: Listar contatos
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
    post:
      tags: [contacts]
      summary: Criar contato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, name]
              properties:
                companyId: { type: string, format: uuid }
                name:      { type: string }
                cpf:       { type: string, nullable: true }
                cnpj:      { type: string, nullable: true }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }

  /api/contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [contacts]
      summary: Atualizar contato
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                cpf:  { type: string, nullable: true }
                cnpj: { type: string, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
    delete:
      tags: [contacts]
      summary: Excluir contato
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ── Payables ──────────────────────────────────────────────────

  /api/payables:
    get:
      tags: [payables]
      summary: Listar contas a pagar/receber
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            type: string
            enum: [payable, receivable]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payable' }
    post:
      tags: [payables]
      summary: Criar conta a pagar/receber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, description, amount, type, due_date]
              properties:
                companyId:    { type: string, format: uuid }
                description:  { type: string }
                amount:       { type: number }
                type:         { type: string, enum: [payable, receivable] }
                due_date:     { type: string, format: date }
                contact_name: { type: string, nullable: true }
                notes:        { type: string, nullable: true }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payable' }

  /api/payables/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [payables]
      summary: Atualizar conta a pagar/receber
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:  { type: string }
                amount:       { type: number }
                due_date:     { type: string, format: date }
                paid_date:    { type: string, format: date, nullable: true }
                status:       { type: string, enum: [pending, paid, overdue, cancelled] }
                contact_name: { type: string, nullable: true }
                notes:        { type: string, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payable' }
    delete:
      tags: [payables]
      summary: Excluir conta a pagar/receber
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  # ── Reports ───────────────────────────────────────────────────

  /api/cash-flow:
    get:
      tags: [reports]
      summary: Fluxo de caixa por dia
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items: { $ref: '#/components/schemas/CashFlowDay' }
                  totalIncome:  { type: number }
                  totalExpense: { type: number }
                  netBalance:   { type: number }

  /api/income-statement:
    get:
      tags: [reports]
      summary: DRE — Demonstração do Resultado do Exercício
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  income:
                    type: array
                    items: { $ref: '#/components/schemas/IncomeStatementLine' }
                  expense:
                    type: array
                    items: { $ref: '#/components/schemas/IncomeStatementLine' }
                  totalIncome:  { type: number }
                  totalExpense: { type: number }
                  netResult:    { type: number }
