<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syncero Books — API Docs</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0f19; }
    #back {
      position: fixed; top: 12px; left: 12px; z-index: 9999;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 6px;
      background: #1a2236; border: 1px solid #1e2d45;
      color: #94a3b8; font-size: 12px; font-family: system-ui, sans-serif;
      text-decoration: none; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    #back:hover { border-color: #10b981; color: #f1f5f9; }
    #back svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <a id="back" href="./index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Todas as APIs
  </a>

  <div id="app"></div>

  <script type="module">
    import { createApiReference } from '@scalar/api-reference'
    createApiReference(document.getElementById('app'), {
      spec: { url: '/openapi-books.yaml' },
      darkMode: true,
      theme: 'default',
      layout: 'sidebar',
      defaultHttpClient: { targetKey: 'js', clientKey: 'fetch' },
      customCss: `
        .dark-mode { --scalar-background-1: #0b0f19; --scalar-background-2: #111827; --scalar-background-3: #1a2236; }
        .scalar-app { padding-top: 0 !important; }
      `,
    })
  </script>
</body>
</html>
