<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syncero Flow — API Docs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    html, body { margin: 0; padding: 0; }
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 40px;
      background: #0b0f19; border-bottom: 1px solid #1e2d45;
      z-index: 99999;
      display: flex; align-items: center; padding: 0 12px;
    }
    #back {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 6px;
      background: #1a2236; border: 1px solid #1e2d45;
      color: #94a3b8; font-size: 12px; font-family: system-ui, sans-serif;
      text-decoration: none; transition: border-color .15s, color .15s;
    }
    #back:hover { border-color: #3b82f6; color: #f1f5f9; }
    #back svg { width: 14px; height: 14px; flex-shrink: 0; }
    body { padding-top: 40px; }
  </style>
</head>
<body>
  <div id="topbar">
    <a id="back" href="./index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span id="back-label">Todas as APIs</span>
    </a>
  </div>

  <script
    id="api-reference"
    data-url="/openapi-flow.json"
    data-configuration='{"darkMode":true,"layout":"sidebar","defaultHttpClient":{"targetKey":"js","clientKey":"fetch"},"customCss":".sidebar{top:40px!important;height:calc(100vh - 40px)!important}.t-doc__sidebar{top:40px!important;height:calc(100vh - 40px)!important}"}'
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1"></script>
  <script>
    try {
      const lang = JSON.parse(localStorage.getItem('syncero-prefs') || '{}').language
        || (navigator.language?.startsWith('en') ? 'en' : 'pt')
      const labels = { pt: 'Todas as APIs', en: 'All APIs' }
      document.getElementById('back-label').textContent = labels[lang] || labels.pt
      document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR'
    } catch {}
  </script>
</body>
</html>
