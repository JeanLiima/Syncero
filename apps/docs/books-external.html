<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syncero Books — Integration API</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    html, body { margin: 0; padding: 0; }
    #back {
      position: fixed; top: 12px; right: 12px; z-index: 9999;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 6px;
      background: #1a2236; border: 1px solid #1e2d45;
      color: #94a3b8; font-size: 12px; font-family: system-ui, sans-serif;
      text-decoration: none; transition: border-color .15s, color .15s;
    }
    #back:hover { border-color: #10b981; color: #f1f5f9; }
    #back svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>
<body>
  <a id="back" href="./index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span id="back-label"></span>
  </a>

  <!-- 1. Elemento vazio que o Scalar vai ler -->
  <script id="api-reference"></script>

  <!-- 2. Definir data-url ANTES do Scalar CDN carregar -->
  <script>
    ;(function () {
      const labels = { pt: 'Voltar', en: 'Back' }
      const specs  = {
        pt: '/openapi-books-external.json',
        en: '/openapi-books-external-en.json',
      }
      let lang = 'pt'
      try {
        const prefs = JSON.parse(localStorage.getItem('syncero-prefs') || '{}')
        lang = prefs.language || (navigator.language?.startsWith('en') ? 'en' : 'pt')
      } catch {}

      document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR'
      document.getElementById('back-label').textContent = labels[lang] || labels.pt

      const ref = document.getElementById('api-reference')
      ref.setAttribute('data-url', specs[lang] || specs.pt)
      ref.setAttribute('data-configuration', JSON.stringify({
        darkMode: true,
        layout: 'sidebar',
        defaultHttpClient: { targetKey: 'js', clientKey: 'fetch' },
      }))
    })()
  </script>

  <!-- 3. Scalar lê o data-url já definido -->
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1"></script>
</body>
</html>
